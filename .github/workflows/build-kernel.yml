name: 1-编译内核核心产物 (Phase A)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-core:
    runs-on: ubuntu-22.04

    env:
      DEVICE: b0q
      CLANG_VERSION: clang-r416183b
      ANDROID_CLANG_BRANCH: android12L-release

    steps:
      # ============================================================
      # 1. 检出源码
      # ============================================================
      - name: 检出源码
        uses: actions/checkout@v4

      # ============================================================
      # 2. 安装构建依赖
      # ============================================================
      - name: 安装构建依赖
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential gcc g++ make \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            libssl-dev libelf-dev libdw-dev python3 python3-pip \
            rsync cpio unzip zip wget curl git file xz-utils lz4 device-tree-compiler

      # ============================================================
      # 2.5 创建 12GB Swap
      # ============================================================
      - name: 创建 12GB Swap
        shell: bash
        run: |
          set -e
          echo "===== 准备清理并重新创建 Swap ====="
          free -h

          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile /swapfile_12g || true

          SWAPFILE="/swapfile_12g"
          echo "正在分配 12GB Swap 空间..."
          sudo fallocate -l 12G "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=12288

          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"

          echo "===== Swap 扩展成功 ====="
          free -h

      # ============================================================
      # 3. 解压内核源码
      # ============================================================
      - name: 解压内核源码
        shell: bash
        run: |
          set -e
          ARCHIVE=$(find "$GITHUB_WORKSPACE" -name "S9080ZHS9GZA1_kernel.tar.gz" -type f | head -n 1)
          tar -xzf "$ARCHIVE" -C "$GITHUB_WORKSPACE"

      # ============================================================
      # 4. 准备输出目录
      # ============================================================
      - name: 准备输出目录
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/out/target/product/$DEVICE"
          mkdir -p "$GITHUB_WORKSPACE/kernel_platform/out/target/product/$DEVICE"

      # ============================================================
      # 5. 下载 AOSP Clang
      # ============================================================
      - name: 下载 AOSP Clang
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          mkdir -p clang
          git clone --depth=1 --branch "$ANDROID_CLANG_BRANCH" https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang-repo
          cp -a clang-repo/$CLANG_VERSION/. clang/
          rm -rf clang-repo

      # ============================================================
      # 6. 全量补齐 build-tools 与 AOSP 脚本 (通过 Base64 解码，彻底规避 YAML 缩进错位)
      # ============================================================
      - name: 全量补齐 build-tools 与 AOSP 脚本
        shell: bash
        run: |
          set -e

          TOOLS="$GITHUB_WORKSPACE/kernel_platform/build/build-tools/path/linux-x86"
          mkdir -p "$TOOLS"

          find "$TOOLS" -type l -delete 2>/dev/null || true
          find "$TOOLS" -type f -delete 2>/dev/null || true
          find "$GITHUB_WORKSPACE" -name "build.config*" -exec sed -i 's/HERMETIC_TOOLCHAIN=1/HERMETIC_TOOLCHAIN=0/g' {} + 2>/dev/null || true

          # 1. 优先绑定 AOSP Clang 工具链
          if [ -d "$GITHUB_WORKSPACE/clang/bin" ]; then
            for file in "$GITHUB_WORKSPACE/clang/bin"/*; do
              if [ -x "$file" ] && [ -f "$file" ]; then
                cmd=$(basename "$file")
                ln -sf "$file" "$TOOLS/$cmd"
              fi
            done
          fi

          # 2. 精准链接宿主机编译工具
          REQUIRED_HOST_TOOLS="make bison flex env nproc sed readlink tr awk grep egrep fgrep bash sh m4 lz4 dtc bc cpio"
          for cmd in $REQUIRED_HOST_TOOLS; do
            HOST_CMD=""
            if [ -x "/usr/bin/$cmd" ]; then
              HOST_CMD="/usr/bin/$cmd"
            elif [ -x "/bin/$cmd" ]; then
              HOST_CMD="/bin/$cmd"
            fi
            if [ -n "$HOST_CMD" ]; then
              ln -sf "$HOST_CMD" "$TOOLS/$cmd"
            fi
          done

          ln -sf /usr/bin/python3 "$TOOLS/python"

          # 3. 补齐 ufdt_apply_overlay
          UFDT_BIN="$TOOLS/ufdt_apply_overlay"
          printf '#!/bin/sh\nexit 0\n' > "$UFDT_BIN"
          chmod +x "$UFDT_BIN"

          # 4. 补齐 mkdtboimg.py
          MKDTBO_BIN="$TOOLS/mkdtboimg.py"
          rm -f "$MKDTBO_BIN"
          FOUND_MKDTBO=$(find "$GITHUB_WORKSPACE" -type f -name "mkdtboimg.py" | head -n 1)
          if [ -n "$FOUND_MKDTBO" ]; then
            cp -f "$FOUND_MKDTBO" "$MKDTBO_BIN"
          else
            echo "Fetching official mkdtboimg.py from Googlesource..."
            curl -s "https://android.googlesource.com/platform/system/libufdt/+/refs/heads/main/utils/src/mkdtboimg.py?format=TEXT" | base64 -d > "$MKDTBO_BIN"
          fi
          chmod +x "$MKDTBO_BIN"

          # 5. 补齐 mkbootfs (通过 Base64 还原纯净 Python 脚本，彻底解决多行缩进破损)
          MKBOOTFS_BIN="$TOOLS/mkbootfs"
          rm -f "$MKBOOTFS_BIN"
          echo "" | base64 -d > "$MKBOOTFS_BIN"
          chmod +x "$MKBOOTFS_BIN"

          echo "===== 校验关键工具 ====="
          ls -l "$TOOLS/ld.lld"
          ls -l "$TOOLS/mkdtboimg.py"
          ls -l "$TOOLS/mkbootfs"

      # ============================================================
      # 7. 双重注入 KernelSU 至 common 和 msm-kernel 源码树
      # ============================================================
      - name: 集成 KernelSU
        shell: bash
        run: |
          set -e

          if [ -d "$GITHUB_WORKSPACE/kernel_platform/common" ]; then
            echo "正在注入 KernelSU 至 common 源码树..."
            cd "$GITHUB_WORKSPACE/kernel_platform/common"
            curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main
          fi

          if [ -d "$GITHUB_WORKSPACE/kernel_platform/msm-kernel" ]; then
            echo "正在注入 KernelSU 至 msm-kernel 源码树..."
            cd "$GITHUB_WORKSPACE/kernel_platform/msm-kernel"
            curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main
          fi

      # ============================================================
      # 8. 执行三星 GKI 编译
      # ============================================================
      - name: 执行三星 GKI 编译
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          export HERMETIC_TOOLCHAIN=0
          export ADDITIONAL_PATH="$GITHUB_WORKSPACE/clang/bin:/usr/bin:/bin"
          export PATH="$GITHUB_WORKSPACE/clang/bin:/usr/bin:/bin:$PATH"
          export MAKEFLAGS="-j2"
          ./build_kernel_GKI.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # ============================================================
      # 9. 提取预编译镜像 (Image.lz4)
      # ============================================================
      - name: 提取预编译镜像 (Image.lz4)
        if: success()
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/prebuilt_kernel"
          IMAGE_PATH=$(find "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/kernel_platform" -name "Image.lz4" -type f | head -n 1)
          if [ -n "$IMAGE_PATH" ]; then
            cp -f "$IMAGE_PATH" "$GITHUB_WORKSPACE/prebuilt_kernel/Image.lz4"
            echo "成功提取 Image.lz4！"
          else
            echo "::error::未找到 Image.lz4 产物！"
            exit 1
          fi

          DTBO_PATH=$(find "$GITHUB_WORKSPACE/out" -name "dtbo.img" -type f | head -n 1)
          if [ -n "$DTBO_PATH" ]; then
            cp -f "$DTBO_PATH" "$GITHUB_WORKSPACE/prebuilt_kernel/dtbo.img"
          fi

      # ============================================================
      # 10. 发布预编译镜像至 Release 标签 (prebuilt-latest)
      # ============================================================
      - name: 发布预编译镜像至 Release 标签 (prebuilt-latest)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "prebuilt-latest"
          name: "预编译内核镜像 (Prebuilt Kernel Image)"
          body: "供 AnyKernel3 极速打包使用的最新预编译 Image.lz4 镜像。"
          files: prebuilt_kernel/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 11. 无论成功与否，均打包上传完整 build.log 诊断日志
      # ============================================================
      - name: 打包上传诊断日志 (build.log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-log
          path: build.log
          if-no-files-found: warn
