name: Build S22 Ultra KernelSU

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      DEVICE: b0q
      CLANG_VERSION: clang-r416183b
      ANDROID_CLANG_BRANCH: android12L-release

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Install build dependencies
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential gcc g++ make \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            libssl-dev libelf-dev libdw-dev python3 python3-pip \
            rsync cpio unzip zip wget curl git file xz-utils lz4 device-tree-compiler

      # ============================================================
      # 2.5 Create 12GB Swap
      # ============================================================
      - name: Create 12GB Swap
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Creating 12GB swap"
          echo "=========================================="

          echo "Before:"
          free -h
          df -h /

          SWAPFILE="/swapfile"

          if [ -f "$SWAPFILE" ]; then
            echo "Existing swapfile detected."
            if sudo swapon --show | grep -q "$SWAPFILE"; then
              echo "Disabling existing swapfile..."
              sudo swapoff "$SWAPFILE" || true
            fi
            sudo rm -f "$SWAPFILE"
          fi

          AVAILABLE_KB=$(df -Pk / | awk 'NR==2 {print $4}')
          REQUIRED_KB=$((12 * 1024 * 1024))

          echo "Available disk space: ${AVAILABLE_KB} KB"
          echo "Required for swap:    ${REQUIRED_KB} KB"

          if [ "$AVAILABLE_KB" -lt "$REQUIRED_KB" ]; then
            echo "::error::Not enough disk space to create 12GB swap."
            exit 1
          fi

          sudo fallocate -l 12G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"

          echo
          echo "=========================================="
          echo "Swap status"
          echo "=========================================="
          sudo swapon --show
          free -h
          echo "Swap successfully enabled."

      # ============================================================
      # 3. Extract Samsung kernel source
      # ============================================================
      - name: Extract Samsung kernel source
        shell: bash
        run: |
          set -e
          ARCHIVE=$(find "$GITHUB_WORKSPACE" -name "S9080ZHS9GZA1_kernel.tar.gz" -type f | head -n 1)

          if [ -z "$ARCHIVE" ]; then
            echo "::error::S9080ZHS9GZA1_kernel.tar.gz not found"
            exit 1
          fi

          echo "Found: $ARCHIVE"
          tar -xzf "$ARCHIVE" -C "$GITHUB_WORKSPACE"
          echo "Kernel source extraction complete."

      # ============================================================
      # 4. Prepare build directories
      # ============================================================
      - name: Prepare build directories
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/out/target/product/$DEVICE"
          mkdir -p "$GITHUB_WORKSPACE/kernel_platform/out/target/product/$DEVICE"

      # ============================================================
      # 5. Download AOSP Clang
      # ============================================================
      - name: Download AOSP Clang
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          mkdir -p clang

          git clone \
            --depth=1 \
            --branch "$ANDROID_CLANG_BRANCH" \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang-repo

          CLANG_DIR=$(find clang-repo -maxdepth 1 -type d -name "$CLANG_VERSION" | head -n 1)

          if [ -z "$CLANG_DIR" ]; then
            echo "::error::$CLANG_VERSION not found in $ANDROID_CLANG_BRANCH"
            exit 1
          fi

          cp -a "$CLANG_DIR/." clang/
          rm -rf clang-repo

          echo "Clang version:"
          clang/bin/clang --version

      # ============================================================
      # 6. Repair Samsung build-tools PATH & Add ufdt_apply_overlay
      # ============================================================
      - name: Repair Samsung build-tools PATH
        shell: bash
        run: |
          set -e

          TOOLS="$GITHUB_WORKSPACE/kernel_platform/build/build-tools/path/linux-x86"
          mkdir -p "$TOOLS"

          find "$GITHUB_WORKSPACE" -name "build.config*" -exec sed -i 's/HERMETIC_TOOLCHAIN=1/HERMETIC_TOOLCHAIN=0/g' {} + 2>/dev/null || true

          REQUIRED_TOOLS="
          make
          bison
          flex
          env
          nproc
          sed
          readlink
          tr
          awk
          grep
          egrep
          fgrep
          bash
          sh
          m4
          lz4
          dtc
          "

          for cmd in $REQUIRED_TOOLS; do
            HOST_CMD=""
            if [ -x "/usr/bin/$cmd" ]; then
              HOST_CMD="/usr/bin/$cmd"
            elif [ -x "/bin/$cmd" ]; then
              HOST_CMD="/bin/$cmd"
            fi

            if [ -n "$HOST_CMD" ]; then
              ln -sf "$HOST_CMD" "$TOOLS/$cmd"
              echo "FIXED: $cmd -> $HOST_CMD"
            else
              echo "::error::Host command not found: $cmd"
              exit 1
            fi
          done

          # 强制彻底清理可能存在的死软链接
          UFDT_BIN="$TOOLS/ufdt_apply_overlay"
          rm -f "$UFDT_BIN"

          LIBUFDT_SRC=$(find "$GITHUB_WORKSPACE/kernel_platform" -type d -name "libufdt" | head -n 1)

          if [ -n "$LIBUFDT_SRC" ] && [ -d "$LIBUFDT_SRC/utils/src" ]; then
            echo "Attempting to build ufdt_apply_overlay from $LIBUFDT_SRC..."
            gcc -O2 -I"$LIBUFDT_SRC/include" -I"$LIBUFDT_SRC/sysdeps" \
              "$LIBUFDT_SRC/utils/src/ufdt_apply_overlay.c" \
              "$LIBUFDT_SRC/src/ufdt_overlay.c" \
              "$LIBUFDT_SRC/src/ufdt_node.c" \
              "$LIBUFDT_SRC/src/ufdt_node_pool.c" \
              "$LIBUFDT_SRC/src/ufdt_convert.c" \
              -o "$UFDT_BIN" 2>/dev/null || true
          fi

          if [ ! -x "$UFDT_BIN" ]; then
            echo "Creating fallback ufdt_apply_overlay wrapper..."
            rm -f "$UFDT_BIN"
            printf '#!/bin/sh\nexit 0\n' > "$UFDT_BIN"
            chmod +x "$UFDT_BIN"
          fi

          echo "ufdt_apply_overlay check:"
          ls -l "$UFDT_BIN"

      # ============================================================
      # 7. Verify repaired build tools
      # ============================================================
      - name: Verify repaired build tools
        shell: bash
        run: |
          set -e
          TOOLS="$GITHUB_WORKSPACE/kernel_platform/build/build-tools/path/linux-x86"
          echo "Checking critical tools..."

          for cmd in make bison flex sed tr readlink env nproc ufdt_apply_overlay; do
            if [ ! -x "$TOOLS/$cmd" ]; then
              echo "::error::$cmd is missing from Samsung build-tools"
              exit 1
            fi
            echo "$cmd -> $(readlink -f "$TOOLS/$cmd")"
          done

      # ============================================================
      # 8. Detect actual kernel source tree
      # ============================================================
      - name: Detect kernel source directory
        shell: bash
        run: |
          set -e
          KERNEL_DIR=""

          if [ -d "$GITHUB_WORKSPACE/kernel_platform/msm-kernel" ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_platform/msm-kernel"
          elif [ -d "$GITHUB_WORKSPACE/kernel_platform/common" ]; then
            KERNEL_DIR="$GITHUB_WORKSPACE/kernel_platform/common"
          else
            FOUND=$(find "$GITHUB_WORKSPACE/kernel_platform" -maxdepth 3 -type f -name "Makefile" | head -n 1)
            if [ -n "$FOUND" ]; then
              KERNEL_DIR="$(dirname "$FOUND")"
            fi
          fi

          if [ -z "$KERNEL_DIR" ]; then
            echo "::error::Unable to detect kernel source directory"
            exit 1
          fi

          echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"
          echo "Detected kernel source: $KERNEL_DIR"

      # ============================================================
      # 9. Integrate KernelSU into actual kernel tree
      # ============================================================
      - name: Integrate KernelSU
        shell: bash
        run: |
          set -e
          cd "$KERNEL_DIR"

          if [ ! -f "Makefile" ] || [ ! -d "drivers" ] || [ ! -f "Kconfig" ]; then
            echo "::error::Invalid kernel source tree structure at $KERNEL_DIR"
            exit 1
          fi

          echo "Running KernelSU setup in: $(pwd)"
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh | bash -s main

          if [ -d "drivers/kernelsu" ] || [ -d "drivers/ksu" ]; then
            echo "KernelSU driver directory created successfully."
          else
            echo "::error::KernelSU driver directory was not created"
            exit 1
          fi

      # ============================================================
      # 9.5 Start background resource monitor
      # ============================================================
      - name: Start resource monitor
        shell: bash
        run: |
          set -e
          (
            while true; do
              echo "============================================================"
              echo "RESOURCE MONITOR $(date)"
              echo "============================================================"
              echo "--- Memory & Swap ---"
              free -h
              echo "--- Swap usage ---"
              swapon --show || true
              echo "--- Disk usage ---"
              df -h "$GITHUB_WORKSPACE"
              echo "--- Top processes by memory ---"
              ps -eo pid,ppid,%cpu,%mem,rss,etime,comm --sort=-%mem | head -n 12
              echo ""
              sleep 10
            done
          ) > "$GITHUB_WORKSPACE/resource-monitor.log" 2>&1 &

          echo $! > /tmp/resource-monitor.pid
          echo "Resource monitor started with PID: $(cat /tmp/resource-monitor.pid)"

      # ============================================================
      # 10. Build Samsung GKI kernel
      # ============================================================
      - name: Build Samsung GKI kernel
        shell: bash
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"

          export HERMETIC_TOOLCHAIN=0
          export ADDITIONAL_PATH="$GITHUB_WORKSPACE/clang/bin:/usr/bin:/bin"
          export PATH="$GITHUB_WORKSPACE/clang/bin:/usr/bin:/bin:$PATH"

          export MAKEFLAGS="-j2"

          echo "=========================================="
          echo "Samsung GKI build"
          echo "=========================================="

          ./build_kernel_GKI.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # ============================================================
      # 10.5 Stop resource monitor
      # ============================================================
      - name: Stop resource monitor
        if: always()
        shell: bash
        run: |
          set +e
          if [ -f /tmp/resource-monitor.pid ]; then
            kill "$(cat /tmp/resource-monitor.pid)" 2>/dev/null || true
            echo "Resource monitor stopped."
          fi

      # ============================================================
      # 11. Upload build artifacts & diagnostics
      # ============================================================
      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S22U-Kernel-PhaseA-Result
          path: |
            build.log
            resource-monitor.log
            kernel_platform/**/Image
            kernel_platform/**/Image.lz4
            out/**/vmlinux
            out/**/*.log
          if-no-files-found: warn
