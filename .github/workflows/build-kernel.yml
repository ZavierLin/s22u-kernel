name: Build SM8450 KernelSU Kernel

on:
  workflow_dispatch:
    inputs:
      RELEASE_NOTE:
        description: 'Release 更新说明'
        required: false
        default: '基于 S9080ZHS9GZA1 官方源码与 build_kernel_GKI.sh 构建的 KernelSU 内核'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 检出内核源码
        uses: actions/checkout@v4

      - name: 配置系统构建环境与交叉编译器
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git ccache automake flex bison libssl-dev \
            bc libelf-dev libncurses5-dev libncursesw5-dev \
            zip unzip liblz4-tool u-boot-tools liblzo2-dev \
            device-tree-compiler python3 python3-pip lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            coreutils sed gawk grep

      - name: 解压 S9080ZHS9GZA1 专属内核源码包
        run: |
          if [ -f "$GITHUB_WORKSPACE/S9080ZHS9GZA1_kernel.tar.gz" ]; then
            echo "正在解压 S9080ZHS9GZA1 内核源码..."
            tar -xzf $GITHUB_WORKSPACE/S9080ZHS9GZA1_kernel.tar.gz -C $GITHUB_WORKSPACE
            echo "解压完成！"
          fi

      - name: 补全 AOSP 封闭构建环境中的系统命令软链接 (解决 env / nproc 缺失)
        run: |
          TOOL_PATH="$GITHUB_WORKSPACE/kernel_platform/build/build-tools/path/linux-x86"
          mkdir -p "$TOOL_PATH"
          
          echo "正在将系统常用命令行工具补全至 $TOOL_PATH ..."
          # 补全包含 env 在内的所有关键系统指令
          for cmd in env nproc readlink sed tr grep awk cut find sort uniq dirname basename realpath cp mv rm mkdir hostname expr wc head tail python python3 tar gzip; do
            SYS_BIN=$(which $cmd || true)
            if [ -n "$SYS_BIN" ]; then
              ln -sf "$SYS_BIN" "$TOOL_PATH/$cmd"
            fi
          done

      - name: 预先创建三星原厂编译所需的临时目录 (解决 mktemp 报错)
        run: |
          mkdir -p $GITHUB_WORKSPACE/out/target/product/b0q
          mkdir -p $GITHUB_WORKSPACE/kernel_platform/out/target/product/b0q

      - name: 获取 AOSP Clang 工具链 (r416183b)
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-release/clang-r416183b.tar.gz
          tar -xzf clang-r416183b.tar.gz
          rm clang-r416183b.tar.gz

      - name: 集成 KernelSU 到内核源码
        run: |
          KDIR=""
          if [ -d "$GITHUB_WORKSPACE/kernel_platform/msm-kernel" ]; then
            KDIR="$GITHUB_WORKSPACE/kernel_platform/msm-kernel"
          elif [ -d "$GITHUB_WORKSPACE/kernel_platform/common" ]; then
            KDIR="$GITHUB_WORKSPACE/kernel_platform/common"
          fi

          if [ -n "$KDIR" ]; then
            echo "目标内核目录: $KDIR，开始集成 KernelSU..."
            cd $KDIR
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          else
            echo "未找到 msm-kernel 目录，在当前根目录集成 KernelSU"
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          fi

      - name: 调用三星原厂 build_kernel_GKI.sh 编译内核
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          chmod +x $GITHUB_WORKSPACE/build_kernel_GKI.sh
          cd $GITHUB_WORKSPACE

          # 调起三星原厂 GKI 构建脚本
          ./build_kernel_GKI.sh 2>&1 | tee $GITHUB_WORKSPACE/build.log

          # 校验产物
          IMAGE_FILE=$(find $GITHUB_WORKSPACE -name "Image" -type f | head -n 1)
          if [ -n "$IMAGE_FILE" ]; then
            echo "成功找到内核编译产物: $IMAGE_FILE"
            echo "IMAGE_PATH=$IMAGE_FILE" >> $GITHUB_ENV
          else
            echo "::error::编译结束，未找到 Image 文件！"
            exit 1
          fi

      - name: 编译失败时自动输出 build.log 尾部报错
        if: failure()
        run: |
          echo "=================== BUILD.LOG 尾部 100 行报错日志 ==================="
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            tail -n 100 $GITHUB_WORKSPACE/build.log
          else
            echo "未找到 build.log 文件！"
          fi
          echo "===================================================================="

      - name: 打包 AnyKernel3 Zip 刷机包
        if: success()
        run: |
          mkdir -p $GITHUB_WORKSPACE/anykernel
          cd $GITHUB_WORKSPACE/anykernel
          git clone https://github.com/osm0sis/AnyKernel3.git .

          cp ${{ env.IMAGE_PATH }} ./Image

          sed -i 's/properties()/properties() {\nkernel.string=SM8450 KernelSU Kernel\ndo.devicecheck=0\ndo.modules=0\ndo.systemless=1\ndo.cleanup=1\nis.gki=1\n}/g' anykernel.sh

          zip -r9 $GITHUB_WORKSPACE/AnyKernel3-S22U-KSU.zip * -x .git\* README.md

      - name: 保存调试产物至 Artifacts (build.log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts-${{ github.sha }}
          path: |
            ${{ github.workspace }}/build.log
          retention-days: 7

      - name: 生成 Release 标签
        id: tag
        if: success()
        run: |
          echo "TAG_NAME=ksu-s22u-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: 发布 Kernel Release 刷机包
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: "S22U KernelSU 内核 - ${{ steps.tag.outputs.TAG_NAME }}"
          body: |
            ### 📦 内核构建说明
            ${{ github.event.inputs.RELEASE_NOTE }}

            ---
            ### 🛠️ 刷入指南
            1. 下载下方附件中的 `AnyKernel3-S22U-KSU.zip`。
            2. 在手机端使用 **Kernel Flasher** 或第三方 Recovery 直接刷入。
            3. 重启后安装最新的 [KernelSU App](https://github.com/tiann/KernelSU/releases) 检查授权。

            ---
            - **基线固件**: `S9080ZHS9GZA1`
            - **SoC 平台**: Qualcomm SM8450 (GKI)
          files: |
            ${{ github.workspace }}/AnyKernel3-S22U-KSU.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
